<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Our Wedding Camera</title>


<!-- AMIRI ARABIC FONT -->

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Amiri&display=swap"
  rel="stylesheet"
>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  background:
    #f7f2ea;

  color:
    #3c3028;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  text-align:
    center;

}


.screen {

  min-height: 100vh;

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  padding:
    28px 20px;

}


#welcome {

  background:
    #f7f2ea;

}


.date {

  font-size:
    13px;

  letter-spacing:
    4px;

  margin-bottom:
    28px;

  color:
    #806f60;

}


.names {

  display:
    flex;

  justify-content:
    center;

  align-items:
    flex-end;

  gap:
    28px;

  margin-bottom:
    25px;

}


.name-side {

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

}


.arabic {

  font-family:
    "Times New Roman",
    serif;

  font-size:
    46px;

  line-height:
    1;

}


.person-name {

  font-size:
    13px;

  margin-top:
    7px;

  letter-spacing:
    2px;

}


.heart {

  font-size:
    16px;

  margin-bottom:
    16px;

}


h1 {

  font-size:
    28px;

  font-weight:
    normal;

  letter-spacing:
    1px;

  margin:
    0 0 12px;

}


.subtitle {

  font-size:
    14px;

  color:
    #806f60;

  margin-bottom:
    32px;

}


button {

  border:
    1px solid #8d7967;

  background:
    transparent;

  color:
    #4b3c31;

  padding:
    12px 22px;

  font-family:
    Georgia,
    serif;

  letter-spacing:
    1.5px;

  font-size:
    12px;

  cursor:
    pointer;

  margin:
    5px;

}


button:hover {

  background:
    rgba(120,100,80,0.08);

}


#cameraScreen {

  display:
    none;

  justify-content:
    flex-start;

  padding-top:
    25px;

}


.camera-wrapper {

  width:
    100%;

  max-width:
    500px;

  position:
    relative;

}


#video,
#canvas {

  width:
    100%;

  max-height:
    68vh;

  object-fit:
    contain;

  background:
    #222;

}


#canvas {

  display:
    none;

}


#flash {

  position:
    fixed;

  inset:
    0;

  background:
    white;

  opacity:
    0;

  pointer-events:
    none;

  z-index:
    999;

}


.flash-animation {

  animation:
    cameraFlash 0.35s ease;

}


@keyframes cameraFlash {

  0% {
    opacity: 0;
  }

  20% {
    opacity: 0.95;
  }

  100% {
    opacity: 0;
  }

}


.camera-buttons {

  margin-top:
    15px;

}


#status {

  min-height:
    20px;

  margin:
    12px 0;

  font-size:
    12px;

  letter-spacing:
    1px;

  color:
    #806f60;

}


#galleryInput {

  display:
    none;

}


/* MESSAGE FORM */

#messageBox {

  display:
    none;

  width:
    100%;

  max-width:
    430px;

  padding:
    30px 22px;

}


.message-title {

  font-size:
    24px;

  font-weight:
    normal;

  margin-bottom:
    8px;

}


.message-subtitle {

  font-size:
    13px;

  color:
    #806f60;

  margin-bottom:
    25px;

}


.message-preview {

  width:
    100%;

  max-height:
    250px;

  object-fit:
    contain;

  margin-bottom:
    25px;

}


.field {

  text-align:
    left;

  margin-bottom:
    17px;

}


.field label {

  display:
    block;

  font-size:
    12px;

  letter-spacing:
    1px;

  margin-bottom:
    7px;

}


.required {

  color:
    #9b6258;

}


input,
textarea {

  width:
    100%;

  border:
    1px solid #b9aa9c;

  background:
    rgba(255,255,255,0.45);

  padding:
    12px;

  font-family:
    Georgia,
    serif;

  font-size:
    14px;

  color:
    #3c3028;

  outline:
    none;

}


textarea {

  min-height:
    100px;

  resize:
    vertical;

}


input:focus,
textarea:focus {

  border-color:
    #806f60;

}


#errorMessage {

  display:
    none;

  color:
    #9b6258;

  font-size:
    12px;

  margin:
    5px 0 12px;

}


/* GALLERY */

#galleryScreen {

  display:
    none;

  justify-content:
    flex-start;

  padding-top:
    35px;

}


.gallery-title {

  font-size:
    26px;

  font-weight:
    normal;

  margin-bottom:
    7px;

}


.gallery-subtitle {

  font-size:
    12px;

  color:
    #806f60;

  margin-bottom:
    25px;

}


#galleryGrid {

  width:
    100%;

  max-width:
    700px;

  display:
    grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap:
    10px;

}


.gallery-item {

  background:
    #eee6dc;

  padding:
    7px;

}


.gallery-item img {

  width:
    100%;

  aspect-ratio:
    1 / 1;

  object-fit:
    cover;

  display:
    block;

  cursor:
    pointer;

}


.guest-name {

  font-size:
    13px;

  margin-top:
    9px;

  letter-spacing:
    0.5px;

}


.guest-message {

  font-size:
    12px;

  line-height:
    1.5;

  color:
    #806f60;

  margin:
    5px 2px 7px;

}


.gallery-empty {

  grid-column:
    1 / -1;

  padding:
    50px 20px;

  color:
    #806f60;

  font-size:
    13px;

}


/* FULLSCREEN VIEWER */

#viewer {

  display:
    none;

  position:
    fixed;

  inset:
    0;

  background:
    rgba(20,17,14,0.96);

  z-index:
    1000;

  align-items:
    center;

  justify-content:
    center;

}


#viewerImage {

  max-width:
    92vw;

  max-height:
    88vh;

  object-fit:
    contain;

}


.viewer-close {

  position:
    absolute;

  top:
    18px;

  right:
    20px;

  color:
    white;

  font-size:
    30px;

  cursor:
    pointer;

}


.viewer-arrow {

  position:
    absolute;

  top:
    50%;

  transform:
    translateY(-50%);

  color:
    white;

  font-size:
    38px;

  cursor:
    pointer;

  padding:
    20px;

}


#viewerPrev {

  left:
    0;

}


#viewerNext {

  right:
    0;

}


@media (max-width: 500px) {

  h1 {

    font-size:
      24px;

  }

  #galleryGrid {

    gap:
      7px;

  }

}

</style>

</head>


<body>


<!-- WELCOME -->

<section
  id="welcome"
  class="screen"
>

  <div class="date">
    26 · 09 · 2026
  </div>


  <div class="names">

    <div class="name-side">

      <div class="arabic">
        ف
      </div>

      <div class="person-name">
        Faris
      </div>

    </div>


    <div class="heart">
      ♡
    </div>


    <div class="name-side">

      <div class="arabic">
        م
      </div>

      <div class="person-name">
        Mira
      </div>

    </div>

  </div>


  <h1>
    Mari Menggamit Kenangan Bersama
  </h1>


  <div class="subtitle">
    Capture a little memory from your eyes ♡
  </div>
  
  <button id="openCamera">
    OPEN CAMERA
  </button>

</section>



<!-- CAMERA -->

<section
  id="cameraScreen"
  class="screen"
>

  <div class="camera-wrapper">

    <video
      id="video"
      autoplay
      playsinline
    ></video>


    <canvas id="canvas"></canvas>

  </div>


  <div id="status"></div>


  <div class="camera-buttons">

    <button id="snap">
      TAKE PHOTO
    </button>


    <button id="flip">
      FLIP CAMERA
    </button>


    <button
      id="retake"
      style="display:none;"
    >
      RETAKE
    </button>


    <button
      id="keep"
      style="display:none;"
    >
      UPLOAD ♡
    </button>


    <button id="galleryButton">
      UPLOAD FROM GALLERY ♡
    </button>


    <button id="viewGallery">
      VIEW GALLERY ♡
    </button>

  </div>


  <input
    type="file"
    id="galleryInput"
    accept="image/*"
  >

</section>



<!-- MESSAGE -->

<section
  id="messageBox"
  class="screen"
>

  <div class="message-title">
    Titipkan Sepatah Dua Kata
  </div>


  <div class="message-subtitle">
    Tinggalkan sedikit kenangan buat Faris & Mira ♡
  </div>


  <img
    id="messagePreview"
    class="message-preview"
  >


  <div class="field">

    <label>
      NAMA
      <span class="required">*</span>
    </label>

    <input
      id="guestName"
      type="text"
      placeholder="Tulis nama anda"
      maxlength="80"
    >

  </div>


  <div class="field">

    <label>
      UCAPAN
    </label>

    <textarea
      id="guestMessage"
      placeholder="Tulis ucapan buat Faris & Mira..."
      maxlength="500"
    ></textarea>

  </div>

    Sila masukkan nama anda ♡
  </div>

    KIRIM UCAPAN ♡
  </button>

    SKIP
  </button>

</section>



<!-- GALLERY -->

<section
  id="galleryScreen"
  class="screen"
>

  <div class="gallery-title">
    Bingkai Kenangan
  </div>


  <div class="gallery-subtitle">
    Coretan kenangan buat selamanya ♡
  </div>


  <div id="galleryGrid"></div>


  <div>

    <button id="backCamera">
      BACK TO CAMERA
    </button>

  </div>

</section>



<!-- FLASH -->

<div id="flash"></div>



<!-- VIEWER -->

<div id="viewer">

  <div
    id="viewerClose"
    class="viewer-close"
  >
    ×
  </div>


  <div
    id="viewerPrev"
    class="viewer-arrow"
  >
    ‹
  </div>


  <img
    id="viewerImage"
  >


  <div
    id="viewerNext"
    class="viewer-arrow"
  >
    ›
  </div>

</div>



<script>


/* =========================================
   SETTINGS
========================================= */


const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxYIr46zDLHnF9EDA59pMpEVZAfPxhd_gA8YZmA36KapT-FQm-YySa4vGogaWu7q6kE/exec";


/* =========================================
   ELEMENTS
========================================= */


const welcome =
  document.getElementById("welcome");

const cameraScreen =
  document.getElementById("cameraScreen");

const messageBox =
  document.getElementById("messageBox");

const galleryScreen =
  document.getElementById("galleryScreen");

const openCamera =
  document.getElementById("openCamera");

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const snap =
  document.getElementById("snap");

const flip =
  document.getElementById("flip");

const retake =
  document.getElementById("retake");

const keep =
  document.getElementById("keep");

const galleryButton =
  document.getElementById("galleryButton");

const galleryInput =
  document.getElementById("galleryInput");

const viewGallery =
  document.getElementById("viewGallery");

const backCamera =
  document.getElementById("backCamera");

const status =
  document.getElementById("status");

const flash =
  document.getElementById("flash");

const messagePreview =
  document.getElementById("messagePreview");

const guestName =
  document.getElementById("guestName");

const guestMessage =
  document.getElementById("guestMessage");

const sendMessage =
  document.getElementById("sendMessage");

const skipMessage =
  document.getElementById("skipMessage");

const errorMessage =
  document.getElementById("errorMessage");

const galleryGrid =
  document.getElementById("galleryGrid");

const viewer =
  document.getElementById("viewer");

const viewerImage =
  document.getElementById("viewerImage");

const viewerClose =
  document.getElementById("viewerClose");

const viewerPrev =
  document.getElementById("viewerPrev");

const viewerNext =
  document.getElementById("viewerNext");


/* =========================================
   VARIABLES
========================================= */


let stream = null;

let usingFrontCamera = false;

let currentPhotoId = null;

let galleryPhotos = [];

let currentViewerIndex = 0;

let uploadFinished = false;


/* =========================================
   ARABIC FONT
========================================= */


async function loadArabicFont() {

  try {

    await document.fonts.load(
      "28px 'Amiri'"
    );

  } catch (error) {

    console.log(
      "Arabic font loading error",
      error
    );

  }

}


/* =========================================
   WEDDING STAMP
========================================= */


function addWeddingStamp(context) {

  context.save();

  context.textAlign = "right";

  context.fillStyle =
    "rgba(255,255,255,0.94)";

  context.shadowColor =
    "rgba(0,0,0,0.5)";

  context.shadowBlur =
    3;


  /* FA */

  context.font =
    "28px 'Amiri', serif";

  context.fillText(
    "ف",
    canvas.width - 58,
    canvas.height - 43
  );


  /* LOVE */

  context.font =
    "11px Georgia, serif";

  context.fillText(
    "♡",
    canvas.width - 38,
    canvas.height - 43
  );


  /* MIM */

  context.font =
    "28px 'Amiri', serif";

  context.fillText(
    "م",
    canvas.width - 25,
    canvas.height - 43
  );


  /* VINTAGE DATE */

  context.font =
    "8px 'Times New Roman', serif";

  context.fillStyle =
    "rgba(255,255,255,0.72)";

  context.fillText(
    "26 · 09 · 2026",
    canvas.width - 25,
    canvas.height - 24
  );


  context.restore();

}


/* =========================================
   CAMERA
========================================= */


async function startCamera() {

  await loadArabicFont();


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode:
            usingFrontCamera
              ? "user"
              : "environment"

        },

        audio:
          false

      });


    video.srcObject =
      stream;


    video.style.display =
      "block";

    canvas.style.display =
      "none";


    snap.style.display =
      "inline-block";

    flip.style.display =
      "inline-block";

    retake.style.display =
      "none";

    keep.style.display =
      "none";

    galleryButton.style.display =
      "inline-block";


    status.textContent =
      "";


    if (usingFrontCamera) {

      video.style.transform =
        "scaleX(-1)";

    } else {

      video.style.transform =
        "scaleX(1)";

    }


  } catch (error) {

    status.textContent =
      "Unable to access camera ♡";

    console.error(error);

  }

}


/* =========================================
   OPEN CAMERA
========================================= */


openCamera.addEventListener(
  "click",
  async function() {

    welcome.style.display =
      "none";

    galleryScreen.style.display =
      "none";

    messageBox.style.display =
      "none";

    cameraScreen.style.display =
      "flex";

    await startCamera();

  }
);


/* =========================================
   FLIP CAMERA
========================================= */


flip.addEventListener(
  "click",
  async function() {

    usingFrontCamera =
      !usingFrontCamera;

    await startCamera();

  }
);


/* =========================================
   SHUTTER SOUND
========================================= */


function playShutterSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type =
      "square";

    oscillator.frequency.value =
      120;


    gain.gain.setValueAtTime(
      0.15,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.12
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.12
    );

  } catch (error) {

    console.log(error);

  }

}


/* =========================================
   TAKE PHOTO
========================================= */


snap.addEventListener(
  "click",
  function() {

    playShutterSound();


    flash.classList.remove(
      "flash-animation"
    );


    void flash.offsetWidth;


    flash.classList.add(
      "flash-animation"
    );


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const context =
      canvas.getContext("2d");


    context.save();


    if (usingFrontCamera) {

      context.translate(
        canvas.width,
        0
      );

      context.scale(
        -1,
        1
      );

    }


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    context.restore();


    addWeddingStamp(context);


    video.style.display =
      "none";

    canvas.style.display =
      "block";


    snap.style.display =
      "none";

    flip.style.display =
      "none";

    galleryButton.style.display =
      "none";


    retake.style.display =
      "inline-block";

    keep.style.display =
      "inline-block";


    status.textContent =
      "READY TO UPLOAD ♡";

  }
);


/* =========================================
   GALLERY PHOTO INPUT
========================================= */


galleryButton.addEventListener(
  "click",
  function() {

    galleryInput.click();

  }
);


galleryInput.addEventListener(
  "change",
  async function(event) {

    const file =
      event.target.files[0];

    if (!file) return;


    await loadArabicFont();


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        const image =
          new Image();


        image.onload =
          function() {

            canvas.width =
              image.naturalWidth;

            canvas.height =
              image.naturalHeight;


            const context =
              canvas.getContext("2d");


            context.drawImage(
              image,
              0,
              0,
              canvas.width,
              canvas.height
            );


            addWeddingStamp(context);


            video.style.display =
              "none";

            canvas.style.display =
              "block";


            snap.style.display =
              "none";

            flip.style.display =
              "none";

            galleryButton.style.display =
              "none";


            retake.style.display =
              "inline-block";

            keep.style.display =
              "inline-block";


            status.textContent =
              "READY TO UPLOAD ♡";

          };


        image.src =
          e.target.result;

      };


    reader.readAsDataURL(file);


    galleryInput.value =
      "";

  }
);


/* =========================================
   RETAKE
========================================= */


retake.addEventListener(
  "click",
  async function() {

    currentPhotoId =
      null;

    uploadFinished =
      false;

    await startCamera();

  }
);


/* =========================================
   UPLOAD PHOTO
========================================= */


keep.addEventListener(
  "click",
  async function() {

    if (uploadFinished) return;


    uploadFinished =
      true;


    keep.disabled =
      true;

    retake.disabled =
      true;

    galleryButton.style.display =
      "none";


    status.textContent =
      "SAVING... ♡";


    try {

      const image =
        canvas.toDataURL(
          "image/jpeg",
          0.92
        );


      const response =
        await fetch(
          SCRIPT_URL,
          {

            method:
              "POST",

            body:
              JSON.stringify({

                image:
                  image

              })

          }
        );


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.error ||
          "Upload failed"
        );

      }


      currentPhotoId =
        result.id;


      status.textContent =
        "SAVED ♡";


      /*
        SHOW MESSAGE FORM
      */

      messagePreview.src =
        image;


      guestName.value =
        "";

      guestMessage.value =
        "";

      errorMessage.style.display =
        "none";


      cameraScreen.style.display =
        "none";

      messageBox.style.display =
        "flex";


    } catch (error) {

      console.error(error);


      uploadFinished =
        false;

      keep.disabled =
        false;

      retake.disabled =
        false;


      status.textContent =
        "UPLOAD FAILED ♡";

      galleryButton.style.display =
        "inline-block";

    }

  }
);


/* =========================================
   SEND NAME + MESSAGE
========================================= */


sendMessage.addEventListener(
  "click",
  async function() {

    const name =
      guestName.value.trim();

    const message =
      guestMessage.value.trim();


    if (!name) {

      errorMessage.style.display =
        "block";

      guestName.focus();

      return;

    }


    errorMessage.style.display =
      "none";


    sendMessage.disabled =
      true;

    sendMessage.textContent =
      "SAVING... ♡";


    try {

      const response =
        await fetch(
          SCRIPT_URL,
          {

            method:
              "POST",

            body:
              JSON.stringify({

                action:
                  "updateMessage",

                id:
                  currentPhotoId,

                name:
                  name,

                message:
                  message

              })

          }
        );


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.error ||
          "Message failed"
        );

      }


      messageBox.style.display =
        "none";

      cameraScreen.style.display =
        "flex";


      status.textContent =
        "YOUR MEMORY IS SAVED ♡";


      sendMessage.disabled =
        false;

      sendMessage.textContent =
        "KIRIM UCAPAN ♡";


      keep.disabled =
        false;

      retake.disabled =
        false;


      currentPhotoId =
        null;

      uploadFinished =
        false;


      await startCamera();


    } catch (error) {

      console.error(error);


      sendMessage.disabled =
        false;

      sendMessage.textContent =
        "KIRIM UCAPAN ♡";


      errorMessage.textContent =
        "Something went wrong. Please try again ♡";

      errorMessage.style.display =
        "block";

    }

  }
);


/* =========================================
   SKIP MESSAGE
========================================= */


skipMessage.addEventListener(
  "click",
  async function() {

    messageBox.style.display =
      "none";

    cameraScreen.style.display =
      "flex";


    currentPhotoId =
      null;

    uploadFinished =
      false;


    keep.disabled =
      false;

    retake.disabled =
      false;


    await startCamera();

  }
);


/* =========================================
   LOAD GALLERY
========================================= */


async function loadGallery() {

  galleryGrid.innerHTML =
    '<div class="gallery-empty">Loading memories ♡</div>';


  try {

    const response =
      await fetch(
        SCRIPT_URL + "?t=" + Date.now()
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "Unable to load gallery"
      );

    }


    galleryPhotos =
      result.photos || [];


    galleryGrid.innerHTML =
      "";


    if (
      galleryPhotos.length === 0
    ) {

      galleryGrid.innerHTML =
        '<div class="gallery-empty">No memories yet ♡</div>';

      return;

    }


    galleryPhotos.forEach(
      function(photo, index) {

        const item =
          document.createElement("div");


        item.className =
          "gallery-item";


        const image =
          document.createElement("img");


        image.src =
          photo.url;


        image.loading =
          "lazy";


        image.addEventListener(
          "click",
          function() {

            openViewer(index);

          }
        );


        item.appendChild(
          image
        );


        /*
          SHOW NAME
        */

        if (photo.name) {

          const name =
            document.createElement(
              "div"
            );


          name.className =
            "guest-name";


          name.textContent =
            photo.name;


          item.appendChild(
            name
          );

        }


        /*
          SHOW MESSAGE
        */

        if (photo.message) {

          const message =
            document.createElement(
              "div"
            );


          message.className =
            "guest-message";


          message.textContent =
            "“" +
            photo.message +
            "”";


          item.appendChild(
            message
          );

        }


        galleryGrid.appendChild(
          item
        );

      }
    );


  } catch (error) {

    console.error(error);


    galleryGrid.innerHTML =
      '<div class="gallery-empty">Unable to load gallery ♡</div>';

  }

}


/* =========================================
   VIEW GALLERY
========================================= */


viewGallery.addEventListener(
  "click",
  async function() {

    cameraScreen.style.display =
      "none";

    messageBox.style.display =
      "none";

    galleryScreen.style.display =
      "flex";


    await loadGallery();

  }
);


/* =========================================
   BACK TO CAMERA
========================================= */


backCamera.addEventListener(
  "click",
  async function() {

    galleryScreen.style.display =
      "none";

    cameraScreen.style.display =
      "flex";


    await startCamera();

  }
);


/* =========================================
   FULLSCREEN VIEWER
========================================= */


function openViewer(index) {

  if (
    !galleryPhotos[index]
  ) return;


  currentViewerIndex =
    index;


  viewerImage.src =
    galleryPhotos[index].url;


  viewer.style.display =
    "flex";

}


function closeViewer() {

  viewer.style.display =
    "none";

}


function showPrevious() {

  if (
    galleryPhotos.length === 0
  ) return;


  currentViewerIndex =
    (
      currentViewerIndex -
      1 +
      galleryPhotos.length
    ) %
    galleryPhotos.length;


  viewerImage.src =
    galleryPhotos[
      currentViewerIndex
    ].url;

}


function showNext() {

  if (
    galleryPhotos.length === 0
  ) return;


  currentViewerIndex =
    (
      currentViewerIndex +
      1
    ) %
    galleryPhotos.length;


  viewerImage.src =
    galleryPhotos[
      currentViewerIndex
    ].url;

}


viewerClose.addEventListener(
  "click",
  closeViewer
);


viewerPrev.addEventListener(
  "click",
  showPrevious
);


viewerNext.addEventListener(
  "click",
  showNext
);


/* =========================================
   SWIPE
========================================= */


let touchStartX =
  0;


let touchEndX =
  0;


viewer.addEventListener(
  "touchstart",
  function(event) {

    touchStartX =
      event.changedTouches[0].screenX;

  }
);


viewer.addEventListener(
  "touchend",
  function(event) {

    touchEndX =
      event.changedTouches[0].screenX;


    const difference =
      touchEndX -
      touchStartX;


    if (
      Math.abs(difference) < 50
    ) return;


    if (difference > 0) {

      showPrevious();

    } else {

      showNext();

    }

  }
);


/* =========================================
   CLOSE VIEWER WHEN BACKGROUND CLICKED
========================================= */


viewer.addEventListener(
  "click",
  function(event) {

    if (
      event.target === viewer
    ) {

      closeViewer();

    }

  }
);

</script>
