<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Our Wedding Camera</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #e8dfd1;
  color: #3b3026;
  font-family: Georgia, serif;
  text-align: center;
  padding: 35px 15px;
}

h1 {
  font-size: 32px;
  font-weight: normal;
  letter-spacing: 1px;
  margin: 5px 0 8px;
}

.subtitle {
  font-size: 14px;
  font-style: italic;
  margin-bottom: 25px;
}

.camera-box {
  width: 100%;
  max-width: 520px;
  margin: auto;
  background: #211e1a;
  padding: 14px;
  border-radius: 4px;
  box-shadow:
    0 8px 20px rgba(60, 45, 30, 0.25);
  position: relative;
}

.camera-box::before {
  content: "WEDDING FILM";
  display: block;
  color: #d8c8b3;
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 4px;
  padding: 3px 0 12px;
}

video,
canvas {
  width: 100%;
  display: block;
  border-radius: 2px;
  background: #111;
}

canvas {
  display: none;
}

.photo-number {
  color: #d8c8b3;
  margin-top: 12px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
}

button {
  margin: 18px 5px 5px;
  padding: 14px 25px;
  border: 1px solid #6f6254;
  border-radius: 3px;
  font-family: Georgia, serif;
  font-size: 14px;
  letter-spacing: 1px;
  cursor: pointer;
}

#snap {
  background: #332d26;
  color: #f3eadf;
}

#retake {
  background: #d7c9b7;
  color: #3b3026;
}

#keep {
  background: #f3eadf;
  color: #3b3026;
}

#retake,
#keep {
  display: none;
}

button:active {
  transform: scale(0.96);
}

</style>

</head>


<body>

<h1>Our Wedding Camera</h1>

<div class="subtitle">

Capture a little memory from your eyes ♡

</div>


<div class="camera-box">

<video
id="camera"
autoplay
playsinline>
</video>

<canvas id="photo"></canvas>


<div class="photo-number">

PHOTO
<span id="photoNumber">001</span>

</div>


<button id="snap">

📸 TAKE PHOTO

</button>


<button id="retake">

↩ RETAKE

</button>


<button id="keep">

♡ KEEP PHOTO

</button>

</div>


<script>

const video =
document.getElementById("camera");

const canvas =
document.getElementById("photo");

const snap =
document.getElementById("snap");

const retake =
document.getElementById("retake");

const keep =
document.getElementById("keep");

const photoNumber =
document.getElementById("photoNumber");


let photoCount = 1;


// OPEN CAMERA

navigator.mediaDevices
.getUserMedia({

  video: {
    facingMode: {
      ideal: "environment"
    }
  },

  audio: false

})

.then(function(stream) {

  video.srcObject = stream;

})

.catch(function(error) {

  alert(
    "Please allow camera access ♡"
  );

  console.log(error);

});


// TAKE PHOTO

snap.addEventListener(
"click",
function() {

  canvas.width =
  video.videoWidth;

  canvas.height =
  video.videoHeight;


  const context =
  canvas.getContext("2d");


  context.drawImage(

    video,

    0,

    0,

    canvas.width,

    canvas.height

  );


  video.style.display =
  "none";

  canvas.style.display =
  "block";


  snap.style.display =
  "none";

  retake.style.display =
  "inline-block";

  keep.style.display =
  "inline-block";

});


// RETAKE

retake.addEventListener(
"click",
function() {

  canvas.style.display =
  "none";

  video.style.display =
  "block";


  snap.style.display =
  "inline-block";

  retake.style.display =
  "none";

  keep.style.display =
  "none";

});


// KEEP PHOTO

keep.addEventListener(
  "click",
  async function() {

    const image =
      canvas.toDataURL(
        "image/jpeg",
        0.8
      );

    try {

      const response =
        await fetch(
          "https://script.google.com/macros/s/AKfycbwEi8edo-f36QLQWluoDxqsvzHZ7udcGercX9qvRVIQrCwE5PvW9V5tDL27DSbGKo2S/exec",
          {
            method: "POST",
            body: JSON.stringify({
              image: image
            })
          }
        );

      const result =
        await response.json();

      if (result.success) {

        alert("♡ PHOTO SAVED TO WEDDING ALBUM!");

        photoCount++;

        photoNumber.textContent =
          String(photoCount).padStart(3, "0");

        canvas.style.display =
          "none";

        video.style.display =
          "block";

        snap.style.display =
          "inline-block";

        retake.style.display =
          "none";

        keep.style.display =
          "none";

      } else {

        alert("Upload failed 😭");

      }

    } catch (error) {

      alert("Upload failed. Please try again.");

      console.error(error);

    }

  }
);

</script>

</body>

</html>
