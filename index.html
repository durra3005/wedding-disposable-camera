<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Wedding Camera</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #e8dfd1;
  color: #3b3026;
  font-family: Georgia, serif;
  text-align: center;
  padding: 30px 15px;
}

/* WELCOME SCREEN */

#welcome {
  position: fixed;
  inset: 0;
  background: #e8dfd1;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.welcome-content {
  max-width: 420px;
}

.welcome-small {
  font-size: 12px;
  letter-spacing: 4px;
  margin-bottom: 18px;
}

.welcome-title {
  font-size: 34px;
  font-weight: normal;
  margin: 0 0 15px;
}

.welcome-text {
  font-size: 15px;
  font-style: italic;
  line-height: 1.7;
  margin-bottom: 30px;
}

.open-camera {
  background: #332d26;
  color: #f3eadf;
  border: none;
  padding: 15px 28px;
  font-family: Georgia, serif;
  font-size: 14px;
  letter-spacing: 1px;
  cursor: pointer;
  border-radius: 3px;
}

/* MAIN */

h1 {
  font-size: 32px;
  font-weight: normal;
  letter-spacing: 1px;
  margin: 5px 0 8px;
}

.subtitle {
  font-size: 14px;
  font-style: italic;
  margin-bottom: 25px;
}

.camera-box {
  width: 100%;
  max-width: 520px;
  margin: auto;
  background: #211e1a;
  padding: 14px;
  border-radius: 4px;
  box-shadow: 0 8px 20px rgba(60, 45, 30, 0.25);
  position: relative;
}

.camera-box::before {
  content: "WEDDING FILM";
  display: block;
  color: #d8c8b3;
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 4px;
  padding: 3px 0 12px;
}

.video-wrapper {
  position: relative;
  overflow: hidden;
}

video,
canvas {
  width: 100%;
  display: block;
  border-radius: 2px;
  background: #111;
}

canvas {
  display: none;
}

/* FLASH */

.flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 20;
}

.flash.active {
  animation: cameraFlash 0.35s ease-out;
}

@keyframes cameraFlash {
  0% {
    opacity: 0;
  }

  20% {
    opacity: 0.95;
  }

  100% {
    opacity: 0;
  }
}

/* STATUS */

.status {
  min-height: 20px;
  margin-top: 10px;
  color: #d8c8b3;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
}

.photo-number {
  color: #d8c8b3;
  margin-top: 8px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
}

/* BUTTONS */

button {
  margin: 18px 5px 5px;
  padding: 14px 25px;
  border: 1px solid #6f6254;
  border-radius: 3px;
  font-family: Georgia, serif;
  font-size: 14px;
  letter-spacing: 1px;
  cursor: pointer;
}

#snap {
  background: #332d26;
  color: #f3eadf;
}

#flip {
  background: #d7c9b7;
  color: #3b3026;
}

#retake {
  background: #d7c9b7;
  color: #3b3026;
}

#keep {
  background: #f3eadf;
  color: #3b3026;
}

#retake,
#keep {
  display: none;
}

button:active {
  transform: scale(0.96);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* MOBILE */

@media (max-width: 480px) {

  body {
    padding: 22px 10px;
  }

  h1 {
    font-size: 27px;
  }

  .camera-box {
    padding: 10px;
  }

  button {
    padding: 13px 18px;
    font-size: 13px;
  }

}

</style>
</head>

<body>

<!-- WELCOME SCREEN -->

<div id="welcome">

  <div class="welcome-content">

    <div class="welcome-small">
      26 · 09 · 2026
    </div>

    <div class="welcome-title">
      Our Wedding Camera
    </div>

    <div class="welcome-text">
      Capture a little memory<br>
      from your eyes ♡
    </div>

    <button class="open-camera" id="openCameraButton">
      OPEN CAMERA
    </button>

  </div>

</div>


<h1>Our Wedding Camera</h1>

<div class="subtitle">
  Capture a little memory from your eyes ♡
</div>


<div class="camera-box">

  <div class="video-wrapper">

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

    <canvas id="photo"></canvas>

    <div class="flash" id="flash"></div>

  </div>


  <div class="status" id="status"></div>


  <div class="photo-number">

    PHOTO
    <span id="photoNumber">001</span>

  </div>


  <button id="flip">
    ↔ FLIP CAMERA
  </button>

  <button id="snap">
    📸 TAKE PHOTO
  </button>

  <button id="retake">
    ↩ RETAKE
  </button>

  <button id="keep">
    ♡ KEEP PHOTO
  </button>

</div>


<script>

/* ELEMENTS */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("photo");

const snap =
  document.getElementById("snap");

const flip =
  document.getElementById("flip");

const retake =
  document.getElementById("retake");

const keep =
  document.getElementById("keep");

const photoNumber =
  document.getElementById("photoNumber");

const flash =
  document.getElementById("flash");

const status =
  document.getElementById("status");

const welcome =
  document.getElementById("welcome");

const openCameraButton =
  document.getElementById("openCameraButton");


/* VARIABLES */

let photoCount = 1;

let currentStream = null;

let currentCamera = "environment";

let uploading = false;


/* OPEN CAMERA */

async function openCamera(cameraType) {

  if (currentStream) {

    currentStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    currentStream = null;
  }


  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: cameraType
        },

        audio: false

      });


    currentStream = stream;

    video.srcObject = stream;


    /* FRONT CAMERA = MIRROR */

    if (cameraType === "user") {

      video.style.transform =
        "scaleX(-1)";

    } else {

      video.style.transform =
        "scaleX(1)";

    }


    await video.play();


  } catch (error) {

    console.log(
      "CAMERA ERROR:",
      error.name,
      error.message
    );

    alert(
      "Camera error: " +
      error.name
    );

  }

}


/* OPEN CAMERA BUTTON */

openCameraButton.addEventListener(
  "click",
  async function() {

    welcome.style.display = "none";

    await openCamera(
      currentCamera
    );

  }
);


/* FLIP CAMERA */

flip.addEventListener(
  "click",
  async function() {

    if (
      currentCamera ===
      "environment"
    ) {

      currentCamera = "user";

    } else {

      currentCamera =
        "environment";

    }

    await openCamera(
      currentCamera
    );

  }
);


/* SHUTTER SOUND */

function playShutterSound() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContext) return;

  const audio =
    new AudioContext();

  const oscillator =
    audio.createOscillator();

  const gain =
    audio.createGain();


  oscillator.type = "square";

  oscillator.frequency.setValueAtTime(
    900,
    audio.currentTime
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    250,
    audio.currentTime + 0.08
  );


  gain.gain.setValueAtTime(
    0.12,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audio.currentTime + 0.1
  );


  oscillator.connect(gain);

  gain.connect(audio.destination);

  oscillator.start();

  oscillator.stop(
    audio.currentTime + 0.1
  );

}


/* TAKE PHOTO */

snap.addEventListener(
  "click",
  function() {

    if (
      snap.disabled
    ) return;


    snap.disabled = true;


    /* FLASH */

    flash.classList.remove(
      "active"
    );

    void flash.offsetWidth;

    flash.classList.add(
      "active"
    );


    /* SHUTTER */

    playShutterSound();


    setTimeout(
      function() {


        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;


        const context =
          canvas.getContext("2d");


        /* FRONT CAMERA = MIRROR */

        if (
          currentCamera === "user"
        ) {

          context.save();

          context.translate(
            canvas.width,
            0
          );

          context.scale(
            -1,
            1
          );

          context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );

          context.restore();


        } else {


          /* BACK CAMERA = NORMAL */

          context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );

        }


        /* FILM EFFECT */

        const imageData =
          context.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const pixels =
          imageData.data;


        for (
          let i = 0;
          i < pixels.length;
          i += 4
        ) {

          pixels[i] =
            Math.min(
              255,
              pixels[i] * 1.06 + 8
            );

          pixels[i + 1] =
            Math.min(
              255,
              pixels[i + 1] * 1.01 + 3
            );

          pixels[i + 2] =
            Math.min(
              255,
              pixels[i + 2] * 0.94
            );

        }


        context.putImageData(
          imageData,
          0,
          0
        );


        /* DATE STAMP */

        context.save();

        context.font =
          "bold 22px Arial";

        context.fillStyle =
          "rgba(255,255,255,0.85)";

        context.textAlign =
          "right";

        context.shadowColor =
          "rgba(0,0,0,0.5)";

        context.shadowBlur = 3;


        context.fillText(
          "26 · 09 · 2026",
          canvas.width - 25,
          canvas.height - 25
        );


        context.restore();


        /* SHOW PHOTO */

        video.style.display =
          "none";

        canvas.style.display =
          "block";


        snap.style.display =
          "none";

        flip.style.display =
          "none";


        retake.style.display =
          "inline-block";

        keep.style.display =
          "inline-block";


        status.textContent =
          "READY TO KEEP ♡";


        snap.disabled =
          false;


      },
      180
    );

  }
);


/* RETAKE */

retake.addEventListener(
  "click",
  function() {

    canvas.style.display =
      "none";

    video.style.display =
      "block";


    snap.style.display =
      "inline-block";

    flip.style.display =
      "inline-block";


    retake.style.display =
      "none";

    keep.style.display =
      "none";


    status.textContent =
      "";


    snap.disabled =
      false;

  }
);


/* KEEP PHOTO */

keep.addEventListener(
  "click",
  async function() {

    /* PREVENT DOUBLE UPLOAD */

    if (uploading) return;


    uploading = true;

    keep.disabled = true;

    retake.disabled = true;


    status.textContent =
      "SAVING... ♡";


    const image =
      canvas.toDataURL(
        "image/jpeg",
        0.8
      );


    try {


      const response =
        await fetch(

          "https://script.google.com/macros/s/AKfycbwEi8edo-f36QLQWluoDxqsvzHZ7udcGercX9qvRVIQrCwE5PvW9V5tDL27DSbGKo2S/exec",

          {

            method: "POST",

            body: JSON.stringify({

              image: image

            })

          }

        );


      const result =
        await response.json();


      if (
        result.success
      ) {


        status.textContent =
          "SAVED ♡";


        photoCount++;


        photoNumber.textContent =
          String(photoCount)
          .padStart(
            3,
            "0"
          );


        setTimeout(
          function() {


            canvas.style.display =
              "none";

            video.style.display =
              "block";


            snap.style.display =
              "inline-block";

            flip.style.display =
              "inline-block";


            retake.style.display =
              "none";

            keep.style.display =
              "none";


            keep.disabled =
              false;

            retake.disabled =
              false;

            uploading =
              false;


            status.textContent =
              "";


          },
          700
        );


      } else {


        status.textContent =
          "UPLOAD FAILED 😭";


        keep.disabled =
          false;

        retake.disabled =
          false;

        uploading =
          false;

      }


    } catch (error) {


      console.error(error);


      status.textContent =
        "UPLOAD FAILED — TRY AGAIN";


      keep.disabled =
        false;

      retake.disabled =
        false;

      uploading =
        false;

    }

  }
);

</script>

</body>
</html>
