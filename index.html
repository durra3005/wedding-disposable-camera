<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mari Menggamit Kenangan Bersama</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f3ed;
      color: #3f352d;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 30px 20px 50px;
    }

    /* WELCOME */

    #welcome {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .date {
      font-size: 15px;
      letter-spacing: 4px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 34px;
      font-weight: normal;
      margin: 0 0 12px;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    button {
      font-family: Georgia, "Times New Roman", serif;
      border: 1px solid #6e5b4d;
      background: transparent;
      color: #3f352d;
      padding: 13px 22px;
      border-radius: 3px;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* CAMERA */

    #main {
      display: none;
    }

    .camera-title {
      font-size: 24px;
      font-weight: normal;
      margin: 10px 0 18px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #000;
      border-radius: 4px;
    }

    video,
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    canvas {
      display: none;
    }

    .flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    .flash.active {
      animation: flashEffect 0.18s ease-out;
    }

    @keyframes flashEffect {
      0% {
        opacity: 0.95;
      }

      100% {
        opacity: 0;
      }
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #retake,
    #keep {
      display: none;
    }

    #status {
      min-height: 24px;
      margin-top: 15px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .counter {
      margin-top: 12px;
      font-size: 13px;
      letter-spacing: 2px;
    }

    /* ALBUM BUTTON */

    .album-button-wrapper {
      margin-top: 35px;
    }

    /* ALBUM */

    #album {
      display: none;
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid rgba(63, 53, 45, 0.25);
    }

    .album-title {
      font-size: 27px;
      font-weight: normal;
      margin-bottom: 8px;
    }

    #albumStatus {
      font-size: 14px;
      margin-bottom: 22px;
      min-height: 20px;
    }

    #albumGrid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    #albumGrid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #e9e3db;
      border-radius: 2px;
    }

    #backCamera {
      margin-top: 25px;
    }

    @media (max-width: 380px) {

      .page {
        padding-left: 15px;
        padding-right: 15px;
      }

      h1 {
        font-size: 29px;
      }

      .camera-title {
        font-size: 21px;
      }

      button {
        padding: 12px 17px;
      }

    }

  </style>
</head>


<body>

  <!-- WELCOME -->

  <section id="welcome">

    <div class="date">
      26 · 09 · 2026
    </div>

    <h1>
      Mari Menggamit Kenangan Bersama
    </h1>

    <div class="subtitle">
      Capture a little memory<br>
      from your eyes ♡
    </div>

    <button id="openCameraButton">
      OPEN CAMERA
    </button>

  </section>


  <!-- MAIN CAMERA -->

  <main id="main" class="page">

    <h2 class="camera-
      Bingkai Mempelai 
    </h2>


    <div class="camera-box">

      <video
        id="video"
        autoplay
        playsinline>
      </video>

      <canvas id="canvas"></canvas>

      <div
        id="flash"
        class="flash">
      </div>

    </div>


    <div class="controls">

      <button id="snap">
        TAKE PHOTO
      </button>

      <button id="flip">
        FLIP CAMERA
      </button>

      <button id="retake">
        RETAKE
      </button>

      <button id="keep">
        KEEP ♡
      </button>

    </div>


    <div id="status"></div>


    <div class="counter">
      PHOTO <span id="photoNumber">001</span>
    </div>


    <div class="album-button-wrapper">

      <button id="albumButton">
        WEDDING ALBUM ♡
      </button>

    </div>


    <!-- ALBUM -->

    <section id="album">

      <h2 class="album-title">
        Wedding Album ♡
      </h2>

      <div id="albumStatus">
        Loading memories ♡
      </div>

      <div id="albumGrid"></div>

      <button id="backCamera">
        BACK TO CAMERA
      </button>

    </section>

  </main>


  <script>

    /* =========================
       APPS SCRIPT URL
    ========================= */

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxYIr46zDLHnF9EDA59pMpEVZAfPxhd_gA8YZmA36KapT-FQm-YySa4vGogaWu7q6kE/exec";


    /* =========================
       ELEMENTS
    ========================= */

    const welcome =
      document.getElementById("welcome");

    const main =
      document.getElementById("main");

    const openCameraButton =
      document.getElementById("openCameraButton");

    const video =
      document.getElementById("video");

    const canvas =
      document.getElementById("canvas");

    const snap =
      document.getElementById("snap");

    const flip =
      document.getElementById("flip");

    const retake =
      document.getElementById("retake");

    const keep =
      document.getElementById("keep");

    const flash =
      document.getElementById("flash");

    const status =
      document.getElementById("status");

    const photoNumber =
      document.getElementById("photoNumber");

    const albumButton =
      document.getElementById("albumButton");

    const album =
      document.getElementById("album");

    const albumGrid =
      document.getElementById("albumGrid");

    const albumStatus =
      document.getElementById("albumStatus");

    const backCamera =
      document.getElementById("backCamera");


    /* =========================
       CAMERA VARIABLES
    ========================= */

    let currentStream = null;

    let currentCamera = "environment";

    let photoCount = 1;

    let uploading = false;


    /* =========================
       OPEN CAMERA
    ========================= */

    async function openCamera(cameraType) {

      if (currentStream) {

        currentStream
          .getTracks()
          .forEach(function(track) {
            track.stop();
          });

        currentStream = null;
      }


      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: cameraType
            },

            audio: false

          });


        currentStream = stream;

        video.srcObject = stream;


        /* MIRROR FRONT CAMERA */

        if (cameraType === "user") {

          video.style.transform =
            "scaleX(-1)";

        } else {

          video.style.transform =
            "scaleX(1)";

        }


        await video.play();


      } catch (error) {

        console.log(
          "CAMERA ERROR:",
          error.name,
          error.message
        );

        alert(
          "Camera error: " +
          error.name
        );

      }

    }


    /* =========================
       OPEN CAMERA BUTTON
    ========================= */

    openCameraButton.addEventListener(
      "click",
      async function() {

        welcome.style.display = "none";

        main.style.display = "block";

        await openCamera(currentCamera);

      }
    );


    /* =========================
       FLIP CAMERA
    ========================= */

    flip.addEventListener(
      "click",
      async function() {

        if (
          currentCamera ===
          "environment"
        ) {

          currentCamera = "user";

        } else {

          currentCamera =
            "environment";

        }

        await openCamera(
          currentCamera
        );

      }
    );


    /* =========================
       SHUTTER SOUND
    ========================= */

    function playShutterSound() {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) return;


      const audio =
        new AudioContext();

      const oscillator =
        audio.createOscillator();

      const gain =
        audio.createGain();


      oscillator.type =
        "square";


      oscillator.frequency.setValueAtTime(
        900,
        audio.currentTime
      );


      oscillator.frequency
        .exponentialRampToValueAtTime(
          250,
          audio.currentTime + 0.08
        );


      gain.gain.setValueAtTime(
        0.12,
        audio.currentTime
      );


      gain.gain
        .exponentialRampToValueAtTime(
          0.001,
          audio.currentTime + 0.1
        );


      oscillator.connect(gain);

      gain.connect(
        audio.destination
      );


      oscillator.start();

      oscillator.stop(
        audio.currentTime + 0.1
      );

    }


    /* =========================
       TAKE PHOTO
    ========================= */

    snap.addEventListener(
      "click",
      function() {

        if (snap.disabled) return;

        snap.disabled = true;


        /* FLASH */

        flash.classList.remove(
          "active"
        );

        void flash.offsetWidth;

        flash.classList.add(
          "active"
        );


        /* SOUND */

        playShutterSound();


        setTimeout(
          function() {

            canvas.width =
              video.videoWidth;

            canvas.height =
              video.videoHeight;


            const context =
              canvas.getContext("2d");


            /* FRONT CAMERA */

            if (
              currentCamera ===
              "user"
            ) {

              context.save();

              context.translate(
                canvas.width,
                0
              );

              context.scale(
                -1,
                1
              );

              context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
              );

              context.restore();


            } else {

              /* BACK CAMERA */

              context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
              );

            }


            /* DATE STAMP */

            context.save();

            context.font =
              "bold 22px Arial";

            context.fillStyle =
              "rgba(255,255,255,0.85)";

            context.textAlign =
              "right";

            context.shadowColor =
              "rgba(0,0,0,0.5)";

            context.shadowBlur = 3;


            context.fillText(
              "26 · 09 · 2026",
              canvas.width - 25,
              canvas.height - 25
            );


            context.restore();


            /* SHOW PHOTO */

            video.style.display =
              "none";

            canvas.style.display =
              "block";

            snap.style.display =
              "none";

            flip.style.display =
              "none";

            retake.style.display =
              "inline-block";

            keep.style.display =
              "inline-block";


            status.textContent =
              "READY TO KEEP ♡";


            snap.disabled = false;

          },
          180
        );

      }
    );


    /* =========================
       RETAKE
    ========================= */

    retake.addEventListener(
      "click",
      function() {

        canvas.style.display =
          "none";

        video.style.display =
          "block";

        snap.style.display =
          "inline-block";

        flip.style.display =
          "inline-block";

        retake.style.display =
          "none";

        keep.style.display =
          "none";

        status.textContent =
          "";

        snap.disabled = false;

      }
    );


    /* =========================
       KEEP / UPLOAD
    ========================= */

    keep.addEventListener(
      "click",
      async function() {

        if (uploading) return;


        uploading = true;

        keep.disabled = true;

        retake.disabled = true;


        status.textContent =
          "SAVING... ♡";


        const image =
          canvas.toDataURL(
            "image/jpeg",
            0.8
          );


        try {

          const response =
            await fetch(
              SCRIPT_URL,
              {
                method: "POST",

                body: JSON.stringify({
                  image: image
                })
              }
            );


          const result =
            await response.json();


          if (result.success) {

            status.textContent =
              "SAVED ♡";


            photoCount++;


            photoNumber.textContent =
              String(photoCount)
                .padStart(3, "0");


            /* REFRESH ALBUM */

            await loadAlbum();


            setTimeout(
              function() {

                canvas.style.display =
                  "none";

                video.style.display =
                  "block";

                snap.style.display =
                  "inline-block";

                flip.style.display =
                  "inline-block";

                retake.style.display =
                  "none";

                keep.style.display =
                  "none";


                keep.disabled =
                  false;

                retake.disabled =
                  false;

                uploading =
                  false;

                status.textContent =
                  "";

              },
              700
            );


          } else {

            status.textContent =
              "UPLOAD FAILED 😭";

            keep.disabled =
              false;

            retake.disabled =
              false;

            uploading =
              false;

          }


        } catch (error) {

          console.error(error);

          status.textContent =
            "UPLOAD FAILED — TRY AGAIN";


          keep.disabled =
            false;

          retake.disabled =
            false;

          uploading =
            false;

        }

      }
    );


    /* =========================
       LOAD WEDDING ALBUM
    ========================= */

    async function loadAlbum() {

      albumStatus.textContent =
        "Loading memories ♡";


      try {

        const response =
          await fetch(
            SCRIPT_URL +
            "?t=" +
            Date.now()
          );


        const result =
          await response.json();


        if (!result.success) {

          albumStatus.textContent =
            "Unable to load album.";

          return;

        }


        albumGrid.innerHTML =
          "";


        if (
          !result.photos ||
          result.photos.length === 0
        ) {

          albumStatus.textContent =
            "No memories yet ♡";

          return;

        }


        albumStatus.textContent =
          result.photos.length +
          " memories ♡";


        result.photos.forEach(
          function(photo) {

            const image =
              document.createElement(
                "img"
              );


            image.src =
              photo.url;


            image.alt =
              "Wedding memory";


            image.loading =
              "lazy";


            albumGrid.appendChild(
              image
            );

          }
        );


      } catch (error) {

        console.error(error);

        albumStatus.textContent =
          "Unable to load album.";

      }

    }


    /* =========================
       OPEN ALBUM
    ========================= */

    albumButton.addEventListener(
      "click",
      async function() {

        album.style.display =
          "block";

        albumButton.style.display =
          "none";


        await loadAlbum();


        album.scrollIntoView({
          behavior: "smooth"
        });

      }
    );


    /* =========================
       BACK TO CAMERA
    ========================= */

    backCamera.addEventListener(
      "click",
      function() {

        album.style.display =
          "none";

        albumButton.style.display =
          "inline-block";


        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    );

  </script>

</body>

</html>
