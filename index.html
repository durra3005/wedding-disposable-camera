<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  background: #f7f2ea;

  color: #3c3028;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  text-align: center;

}


.screen {

  min-height: 100vh;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  padding: 28px 20px;

}


#welcome {

  background: #f7f2ea;

}


.date {

  font-size: 13px;

  letter-spacing: 4px;

}


.names {

  display: flex;

  justify-content: center;

  gap: 28px;

  margin-bottom: 25px;

}


.name-side {

  display: flex;

  flex-direction: column;

  align-items: center;

}


.arabic {

  font-family:
    "Amiri",
    "Times New Roman",
    serif;

  font-size: 46px;

  line-height: 1;

}


.person-name {

  font-size: 13px;

  margin-top: 7px;

  letter-spacing: 2px;

}


.heart {

  font-size: 16px;

  margin-bottom: 16px;

}


h1 {

  font-size: 28px;

  font-weight: normal;

  letter-spacing: 1px;

  margin: 0 0 12px;

}


.subtitle {

  font-size: 14px;

  color: #806f60;

  margin-bottom: 32px;

}


button {

  border: 1px solid #8d7967;

  background: transparent;

  color: #4b3c31;

  padding: 12px 22px;

  font-family:
    Georgia,
    serif;

  letter-spacing: 1.5px;

  font-size: 12px;

  cursor: pointer;

}


button:hover {

  background:
    rgba(120,100,80,0.08);

}


button:disabled {

  opacity: 0.5;

  cursor: not-allowed;

}


/* CAMERA */

#cameraScreen {

  display: none;

  justify-content: flex-start;

  padding-top: 25px;

}


.camera-wrapper {

  width: 100%;

  max-width: 500px;

  position: relative;

}


#video,
#canvas {

  width: 100%;

  max-height: 68vh;

  object-fit: contain;

  background: #222;

}


#canvas {

  display: none;

}


/* RECORDING PREVIEW */

#recordingPreview {

  display: none;

  width: 100%;

  max-height: 68vh;

  object-fit: contain;

  background: #222;

}


.recording-timer {

  min-height: 25px;

  margin-top: 8px;

  font-size: 14px;

  letter-spacing: 2px;

  color: #9b6258;

}


#flash {

  position: fixed;

  inset: 0;

  background: white;

  opacity: 0;

  pointer-events: none;

  z-index: 999;

}


.flash-animation {

  animation:
    cameraFlash 0.35s ease;

}


@keyframes cameraFlash {

  0% {
    opacity: 0;
  }

  20% {
    opacity: 0.95;
  }

  100% {
    opacity: 0;
  }

}


.camera-buttons {

  margin-top: 15px;

  max-width: 500px;

}


#status {

  min-height: 20px;

  margin: 12px 0;

  font-size: 12px;

  letter-spacing: 1px;

  color: #806f60;

}


/* ONE MEDIA INPUT */

#mediaGalleryInput {

  display: none;

}


/* MESSAGE FORM */

#messageBox {

  display: none;

  width: 100%;

  max-width: 430px;

  padding: 30px 22px;

}


.message-title {

  font-size: 24px;

  font-weight: normal;

  margin-bottom: 8px;

}


.message-subtitle {

  font-size: 13px;

  color: #806f60;

  margin-bottom: 25px;

}


.message-preview {

  width: 100%;

  max-height: 250px;

  object-fit: contain;

  margin-bottom: 25px;

  background: #222;

}


#messageVideoPreview {

  display: none;

}


.field {

  text-align: left;

  margin-bottom: 17px;

}


.field label {

  display: block;

  font-size: 12px;

  letter-spacing: 1px;

  margin-bottom: 7px;

}


.required {

  color: #9b6258;

}


input,
textarea {

  width: 100%;

  border: 1px solid #b9aa9c;

  background:
    rgba(255,255,255,0.45);

  padding: 12px;

  font-family:
    Georgia,
    serif;

  font-size: 14px;

  color: #3c3028;

  outline: none;

}


textarea {

  min-height: 100px;

  resize: vertical;

}


input:focus,
textarea:focus {

  border-color: #806f60;

}


#errorMessage {

  display: none;

  color: #9b6258;

  font-size: 12px;

  margin: 5px 0 12px;

}


/* GALLERY */

#galleryScreen {

  display: none;

  justify-content: flex-start;

  padding-top: 35px;

}


.gallery-title {

  font-size: 26px;

  font-weight: normal;

  margin-bottom: 7px;

}


.gallery-subtitle {

  font-size: 12px;

  color: #806f60;

  margin-bottom: 25px;

}


#galleryGrid {

  width: 100%;

  max-width: 700px;

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 10px;

}


.gallery-item {

  background: #eee6dc;

  padding: 7px;

}


.gallery-item img,
.gallery-item video {

  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  display: block;

  cursor: pointer;

}


.gallery-item video {

  background: #222;

}


.video-label {

  font-size: 10px;

  letter-spacing: 1.5px;

  color: #806f60;

  margin-top: 6px;

}


.guest-name {

  font-size: 13px;

  margin-top: 9px;

  letter-spacing: 0.5px;

}


.guest-message {

  font-size: 12px;

  line-height: 1.5;

  color: #806f60;

  margin: 5px 2px 7px;

}


.gallery-empty {

  grid-column: 1 / -1;

  padding: 50px 20px;

  color: #806f60;

  font-size: 13px;

}


/* FULLSCREEN VIEWER */

#viewer {

  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(20,17,14,0.96);

  z-index: 1000;

  align-items: center;

  justify-content: center;

}


#viewerImage,
#viewerVideo {

  max-width: 92vw;

  object-fit: contain;

}


#viewerVideo {

}


.viewer-close {

  position: absolute;

  top: 18px;

  right: 20px;

  color: white;

  font-size: 30px;

  cursor: pointer;

  z-index: 1002;

}


.viewer-arrow {

  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  color: white;

  font-size: 38px;

  cursor: pointer;

  padding: 20px;

  z-index: 1002;

}


#viewerPrev {

  left: 0;

}


#viewerNext {

  right: 0;

}


.bingkai-mempelai {

  margin-bottom: 12px;

  font-size: 16px;

@media (max-width: 500px) {

  h1 {

<script>


/* =========================================
   SETTINGS
========================================= */


const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxYIr46zDLHnF9EDA59pMpEVZAfPxhd_gA8YZmA36KapT-FQm-YySa4vGogaWu7q6kE/exec";


const MAX_VIDEO_SECONDS = 10;

const MAX_VIDEO_SIZE =
  50 * 1024 * 1024;


/* =========================================
   ELEMENTS
========================================= */


const welcome =
  document.getElementById("welcome");

const cameraScreen =
  document.getElementById("cameraScreen");

const messageBox =
  document.getElementById("messageBox");

const galleryScreen =
  document.getElementById("galleryScreen");

const openCamera =
  document.getElementById("openCamera");

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const recordingPreview =
  document.getElementById("recordingPreview");

const snap =
  document.getElementById("snap");

const flip =
  document.getElementById("flip");

const recordVideo =
  document.getElementById("recordVideo");

const stopRecording =
  document.getElementById("stopRecording");

const keepVideo =
  document.getElementById("keepVideo");

const retake =
  document.getElementById("retake");

const keep =
  document.getElementById("keep");

const mediaGalleryButton =
  document.getElementById(
    "mediaGalleryButton"
  );

const mediaGalleryInput =
  document.getElementById(
    "mediaGalleryInput"
  );

const viewGallery =
  document.getElementById("viewGallery");

const backCamera =
  document.getElementById("backCamera");

const status =
  document.getElementById("status");

const flash =
  document.getElementById("flash");

const recordingTimer =
  document.getElementById(
    "recordingTimer"
  );

const messagePreview =
  document.getElementById(
    "messagePreview"
  );

const messageVideoPreview =
  document.getElementById(
    "messageVideoPreview"
  );

const guestName =
  document.getElementById("guestName");

const guestMessage =
  document.getElementById(
    "guestMessage"
  );

const sendMessage =
  document.getElementById(
    "sendMessage"
  );

const skipMessage =
  document.getElementById(
    "skipMessage"
  );

const errorMessage =
  document.getElementById(
    "errorMessage"
  );

const galleryGrid =
  document.getElementById(
    "galleryGrid"
  );

const viewer =
  document.getElementById("viewer");

const viewerImage =
  document.getElementById(
    "viewerImage"
  );

const viewerVideo =
  document.getElementById(
    "viewerVideo"
  );

const viewerClose =
  document.getElementById(
    "viewerClose"
  );

const viewerPrev =
  document.getElementById(
    "viewerPrev"
  );

const viewerNext =
  document.getElementById(
    "viewerNext"
  );


/* =========================================
   VARIABLES
========================================= */


let stream = null;

let recordingStream = null;

let mediaRecorder = null;

let recordedChunks = [];

let recordedBlob = null;

let recordingInterval = null;

let recordingSeconds = 0;

let usingFrontCamera = false;

let currentPhotoId = null;

let galleryPhotos = [];

let currentViewerIndex = 0;

let uploadFinished = false;

let currentMediaType = "image";

let currentVideoUrl = null;


/* =========================================
   ARABIC FONT
========================================= */


async function loadArabicFont() {

  try {

    await document.fonts.load(
      "28px 'Amiri'"
    );

  } catch (error) {

    console.log(
      "Arabic font loading error",
      error
    );

  }

}


/* =========================================
   WEDDING STAMP
========================================= */


function addWeddingStamp(context) {

  context.save();

  context.textAlign = "right";

  context.fillStyle =
    "rgba(255,255,255,0.94)";

  context.shadowColor =
    "rgba(0,0,0,0.5)";

  context.shadowBlur = 3;


  context.font =
    "28px 'Amiri', serif";

  context.fillText(
    "ف",
    canvas.width - 58,
    canvas.height - 43
  );


  context.font =
    "11px Georgia, serif";

  context.fillText(
    "♡",
    canvas.width - 38,
    canvas.height - 43
  );


  context.font =
    "28px 'Amiri', serif";

  context.fillText(
    "م",
    canvas.width - 25,
    canvas.height - 43
  );


  context.font =
    "8px 'Times New Roman', serif";

  context.fillStyle =
    "rgba(255,255,255,0.72)";

  context.fillText(
    "26 · 09 · 2026",
    canvas.width - 25,
    canvas.height - 24
  );


  context.restore();

}


/* =========================================
   CAMERA
========================================= */


async function startCamera() {

  await loadArabicFont();

  stopRecordingStream();


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode:
            usingFrontCamera
              ? "user"
              : "environment"

        },

        audio: false

      });


    video.srcObject =
      stream;


    video.style.display =
      "block";

    canvas.style.display =
      "none";

    recordingPreview.style.display =
      "none";


    snap.style.display =
      "inline-block";

    flip.style.display =
      "inline-block";

    recordVideo.style.display =
      "inline-block";

    stopRecording.style.display =
      "none";

    keepVideo.style.display =
      "none";

    retake.style.display =
      "none";

    keep.style.display =
      "none";

    mediaGalleryButton.style.display =
      "inline-block";


    recordingTimer.textContent =
      "";


    status.textContent =
      "";


    if (usingFrontCamera) {

      video.style.transform =
        "scaleX(-1)";

    } else {

      video.style.transform =
        "scaleX(1)";

    }


  } catch (error) {

    status.textContent =
      "Unable to access camera ♡";

    console.error(error);

  }

}


/* =========================================
   OPEN CAMERA
========================================= */


openCamera.addEventListener(
  "click",
  async function() {

    welcome.style.display =
      "none";

    galleryScreen.style.display =
      "none";

    messageBox.style.display =
      "none";

    cameraScreen.style.display =
      "flex";

    await startCamera();

  }
);


/* =========================================
   FLIP CAMERA
========================================= */


flip.addEventListener(
  "click",
  async function() {

    usingFrontCamera =
      !usingFrontCamera;

    await startCamera();

  }
);


/* =========================================
   SHUTTER SOUND
========================================= */


function playShutterSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type =
      "square";

    oscillator.frequency.value =
      120;


    gain.gain.setValueAtTime(
      0.15,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.12
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.12
    );

  } catch (error) {

    console.log(error);

  }

}


/* =========================================
   TAKE PHOTO
========================================= */


snap.addEventListener(
  "click",
  function() {

    playShutterSound();


    flash.classList.remove(
      "flash-animation"
    );


    void flash.offsetWidth;


    flash.classList.add(
      "flash-animation"
    );


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const context =
      canvas.getContext("2d");


    context.save();


    if (usingFrontCamera) {

      context.translate(
        canvas.width,
        0
      );

      context.scale(
        -1,
        1
      );

    }


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    context.restore();


    addWeddingStamp(context);


    video.style.display =
      "none";

    canvas.style.display =
      "block";


    snap.style.display =
      "none";

    flip.style.display =
      "none";

    recordVideo.style.display =
      "none";

    mediaGalleryButton.style.display =
      "none";


    retake.style.display =
      "inline-block";

    keep.style.display =
      "inline-block";


    status.textContent =
      "READY TO UPLOAD ♡";


    currentMediaType =
      "image";

  }
);


/* =========================================
   ONE PHOTO + VIDEO GALLERY BUTTON
========================================= */


mediaGalleryButton.addEventListener(
  "click",
  function() {

    mediaGalleryInput.click();

  }
);


/* =========================================
   MEDIA GALLERY INPUT
========================================= */


mediaGalleryInput.addEventListener(
  "change",
  async function(event) {

    const file =
      event.target.files[0];

    if (!file) return;


    /*
      PHOTO
    */

    if (
      file.type.startsWith(
        "image/"
      )
    ) {

      await loadArabicFont();


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          const image =
            new Image();


          image.onload =
            function() {

              canvas.width =
                image.naturalWidth;

              canvas.height =
                image.naturalHeight;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );


              addWeddingStamp(
                context
              );


              video.style.display =
                "none";

              canvas.style.display =
                "block";

              recordingPreview.style.display =
                "none";


              snap.style.display =
                "none";

              flip.style.display =
                "none";

              recordVideo.style.display =
                "none";

              mediaGalleryButton.style.display =
                "none";


              retake.style.display =
                "inline-block";

              keep.style.display =
                "inline-block";


              status.textContent =
                "READY TO UPLOAD ♡";


              currentMediaType =
                "image";

            };


          image.src =
            e.target.result;

        };


      reader.readAsDataURL(file);


      mediaGalleryInput.value =
        "";

      return;

    }


    /*
      VIDEO
    */

    if (
      file.type.startsWith(
        "video/"
      )
    ) {

      status.textContent =
        "CHECKING VIDEO... ♡";


      if (
        file.size >
        MAX_VIDEO_SIZE
      ) {

        status.textContent =
          "Video is too large. Maximum 50 MB ♡";

        mediaGalleryInput.value =
          "";

        return;

      }


      const objectUrl =
        URL.createObjectURL(
          file
        );


      const checker =
        document.createElement(
          "video"
        );


      checker.preload =
        "metadata";

      checker.src =
        objectUrl;


      checker.onloadedmetadata =
        function() {

          const duration =
            checker.duration;


          URL.revokeObjectURL(
            objectUrl
          );


          if (
            !isFinite(duration)
          ) {

            status.textContent =
              "Unable to read video length ♡";

            mediaGalleryInput.value =
              "";

            return;

          }


          if (
            duration >
            MAX_VIDEO_SECONDS + 0.05
          ) {

            status.textContent =
              "Video is longer than 10 seconds ♡";

            mediaGalleryInput.value =
              "";

            return;

          }


          recordedBlob =
            file;


          currentVideoUrl =
            URL.createObjectURL(
              recordedBlob
            );


          recordingPreview.src =
            currentVideoUrl;


          video.style.display =
            "none";

          canvas.style.display =
            "none";

          recordingPreview.style.display =
            "block";


          snap.style.display =
            "none";

          flip.style.display =
            "none";

          recordVideo.style.display =
            "none";

          stopRecording.style.display =
            "none";

          mediaGalleryButton.style.display =
            "none";


          keepVideo.style.display =
            "inline-block";


          recordingTimer.textContent =
            "00:" +
            String(
              Math.floor(duration)
            ).padStart(
              2,
              "0"
            );


          status.textContent =
            "VIDEO READY ♡";


          currentMediaType =
            "video";

        };


      checker.onerror =
        function() {

          URL.revokeObjectURL(
            objectUrl
          );

          status.textContent =
            "Unable to read this video ♡";

        };


      mediaGalleryInput.value =
        "";

      return;

    }


    status.textContent =
      "Please choose a photo or video ♡";

    mediaGalleryInput.value =
      "";

  }
);


/* =========================================
   VIDEO MIME TYPE
========================================= */


function getSupportedMimeType() {

  const types = [

    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",

    "video/mp4",

    "video/webm;codecs=vp8,opus",

    "video/webm"

  ];


  for (
    const type of types
  ) {

    if (
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported &&
      MediaRecorder.isTypeSupported(
        type
      )
    ) {

      return type;

    }

  }


  return "";

}


/* =========================================
   RECORD VIDEO
========================================= */


recordVideo.addEventListener(
  "click",
  async function() {

    if (
      !window.MediaRecorder
    ) {

      status.textContent =
        "Video recording is not supported on this browser ♡";

      return;

    }


    try {

      stopRecordingStream();


      recordingStream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode:
              usingFrontCamera
                ? "user"
                : "environment"

          },

          /*
            AUDIO = TRUE
            This records the microphone
            together with the video.
          */

          audio: true

        });


      video.srcObject =
        recordingStream;


      video.style.display =
        "block";

      canvas.style.display =
        "none";

      recordingPreview.style.display =
        "none";


      if (usingFrontCamera) {

        video.style.transform =
          "scaleX(-1)";

      } else {

        video.style.transform =
          "scaleX(1)";

      }


      const mimeType =
        getSupportedMimeType();


      recordedChunks =
        [];

      recordedBlob =
        null;


      const options =
        mimeType
          ? {
              mimeType:
                mimeType,

              videoBitsPerSecond:
                1500000,

              audioBitsPerSecond:
                96000
            }

          : {

              videoBitsPerSecond:
                1500000,

              audioBitsPerSecond:
                96000

            };


      mediaRecorder =
        new MediaRecorder(
          recordingStream,
          options
        );


      mediaRecorder.ondataavailable =
        function(event) {

          if (
            event.data &&
            event.data.size > 0
          ) {

            recordedChunks.push(
              event.data
            );

          }

        };


      mediaRecorder.onstop =
        function() {

          const finalType =
            mediaRecorder.mimeType ||
            mimeType ||
            "video/webm";


          recordedBlob =
            new Blob(
              recordedChunks,
              {
                type:
                  finalType
              }
            );


          stopRecordingStream();


          if (
            recordedBlob.size >
            MAX_VIDEO_SIZE
          ) {

            status.textContent =
              "Video is too large. Please try again ♡";

            recordedBlob =
              null;

            return;

          }


          currentVideoUrl =
            URL.createObjectURL(
              recordedBlob
            );


          recordingPreview.src =
            currentVideoUrl;


          video.style.display =
            "none";

          recordingPreview.style.display =
            "block";


          snap.style.display =
            "none";

          flip.style.display =
            "none";

          recordVideo.style.display =
            "none";

          mediaGalleryButton.style.display =
            "none";

          stopRecording.style.display =
            "none";

          keepVideo.style.display =
            "inline-block";


          status.textContent =
            "VIDEO READY ♡";


          recordingTimer.textContent =
            "00:10 MAX";


          currentMediaType =
            "video";

        };


      mediaRecorder.start(
        250
      );


      recordingSeconds =
        0;


      recordVideo.style.display =
        "none";

      snap.style.display =
        "none";

      flip.style.display =
        "none";

      mediaGalleryButton.style.display =
        "none";

      stopRecording.style.display =
        "inline-block";

      keepVideo.style.display =
        "none";


      status.textContent =
        "RECORDING ♡";


      updateRecordingTimer();


      recordingInterval =
        setInterval(
          function() {

            recordingSeconds++;


            updateRecordingTimer();


            if (
              recordingSeconds >=
              MAX_VIDEO_SECONDS
            ) {

              stopVideoRecording();

            }

          },
          1000
        );


    } catch (error) {

      console.error(error);

      status.textContent =
        "Unable to access camera/microphone ♡";

      stopRecordingStream();

    }

  }
);


/* =========================================
   RECORDING TIMER
========================================= */


function updateRecordingTimer() {

  const seconds =
    Math.min(
      recordingSeconds,
      MAX_VIDEO_SECONDS
    );


  recordingTimer.textContent =
    "00:" +
    String(seconds).padStart(
      2,
      "0"
    );

}


/* =========================================
   STOP RECORDING
========================================= */


stopRecording.addEventListener(
  "click",
  function() {

    stopVideoRecording();

  }
);


function stopVideoRecording() {

  if (
    recordingInterval
  ) {

    clearInterval(
      recordingInterval
    );

    recordingInterval =
      null;

  }


  if (
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ) {

    mediaRecorder.stop();

  }

}


/* =========================================
   STOP RECORDING STREAM
========================================= */


function stopRecordingStream() {

  if (
    recordingStream
  ) {

    recordingStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    recordingStream =
      null;

  }

}


/* =========================================
   UPLOAD VIDEO
========================================= */


keepVideo.addEventListener(
  "click",
  async function() {

    if (
      !recordedBlob ||
      uploadFinished
    ) {

      return;

    }


    uploadFinished =
      true;


    keepVideo.disabled =
      true;


    status.textContent =
      "SAVING VIDEO... ♡";


    try {

      const reader =
        new FileReader();


      const dataUrl =
        await new Promise(
          function(resolve, reject) {

            reader.onload =
              function() {

                resolve(
                  reader.result
                );

              };


            reader.onerror =
              function() {

                reject(
                  reader.error
                );

              };


            reader.readAsDataURL(
              recordedBlob
            );

          }
        );


      const response =
        await fetch(
          SCRIPT_URL,
          {

            method:
              "POST",

            body:
              JSON.stringify({

                video:
                  dataUrl

              })

          }
        );


      const result =
        await response.json();


      if (
        !result.success
      ) {

        throw new Error(
          result.error ||
          "Video upload failed"
        );

      }


      currentPhotoId =
        result.id;


      messageVideoPreview.src =
        currentVideoUrl;

      messageVideoPreview.style.display =
        "block";

      messagePreview.style.display =
        "none";


      guestName.value =
        "";

      guestMessage.value =
        "";

      errorMessage.style.display =
        "none";


      cameraScreen.style.display =
        "none";

      messageBox.style.display =
        "flex";


      status.textContent =
        "SAVED ♡";


    } catch (error) {

      console.error(error);


      uploadFinished =
        false;

      keepVideo.disabled =
        false;


      status.textContent =
        "VIDEO UPLOAD FAILED ♡";

    }

  }
);


/* =========================================
   RETAKE
========================================= */


retake.addEventListener(
  "click",
  async function() {

    currentPhotoId =
      null;

    uploadFinished =
      false;

    await startCamera();

  }
);


/* =========================================
   UPLOAD PHOTO
========================================= */


keep.addEventListener(

  async function() {

    if (uploadFinished) return;

    keep.disabled =

        "inline-block";

    }

  }
);


/* =========================================
   SEND NAME + MESSAGE
========================================= */


sendMessage.addEventListener(
  "click",
  async function() {

    const name =
      guestName.value.trim();

    const message =
      guestMessage.value.trim();


    if (!name) {

      errorMessage.style.display =
        "block";

      guestName.focus();

      return;

    }


    errorMessage.style.display =
      "none";


    sendMessage.disabled =
      true;

    sendMessage.textContent =
      "SAVING... ♡";


    try {

      const response =
        await fetch(
          SCRIPT_URL,
          {

            method:
              "POST",

            body:
              JSON.stringify({

                action:
                  "updateMessage",

                id:
                  currentPhotoId,

                name:
                  name,

                message:
                  message

              })

          }
        );


      const result =
        await response.json();


      if (
        !result.success
      ) {

        throw new Error(
          result.error ||
          "Message failed"
        );

      }


      messageBox.style.display =
        "none";

      cameraScreen.style.display =
        "flex";


      sendMessage.disabled =
        false;

      sendMessage.textContent =
        "KIRIM UCAPAN ♡";


      keep.disabled =
        false;

      retake.disabled =
        false;

      keepVideo.disabled =
        false;


      currentPhotoId =
        null;

      uploadFinished =
        false;

      recordedBlob =
        null;


      await startCamera();


      status.textContent =
        "YOUR MEMORY IS SAVED ♡";


    } catch (error) {

      console.error(error);


      sendMessage.disabled =
        false;

      sendMessage.textContent =
        "KIRIM UCAPAN ♡";


      errorMessage.textContent =
        "Something went wrong. Please try again ♡";

      errorMessage.style.display =
        "block";

    }

  }
);

skipMessage.addEventListener(

    messageBox.style.display =

    cameraScreen.style.display =

    uploadFinished =

      false;

/* =========================================
   LOAD GALLERY
========================================= */


async function loadGallery() {

  galleryGrid.innerHTML =
    '<div class="gallery-empty">Loading memories ♡</div>';


  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?t=" +
        Date.now()
      );


    const result =
      await response.json();


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        "Unable to load gallery"
      );

    }


    galleryPhotos =
      result.photos || [];


    galleryGrid.innerHTML =
      "";


    if (
      galleryPhotos.length === 0
    ) {

      galleryGrid.innerHTML =
        '<div class="gallery-empty">No memories yet ♡</div>';

      return;

    }


    galleryPhotos.forEach(
      function(photo, index) {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "gallery-item";


        /*
          VIDEO
        */

        if (
          photo.type === "video"
        ) {

          const vid =
            document.createElement(
              "video"
            );


          vid.src =
            photo.url;

          vid.controls =
            true;

          vid.playsInline =
            true;

          vid.preload =
            "metadata";


          vid.addEventListener(
            "click",
            function(event) {

              event.stopPropagation();

            }
          );


          item.appendChild(
            vid
          );


          const label =
            document.createElement(
              "div"
            );


          label.className =
            "video-label";


          label.textContent =
            "VIDEO ♡";


          item.appendChild(
            label
          );


        }


        /*
          PHOTO
        */

        else {

          const image =
            document.createElement(
              "img"
            );


          image.src =
            photo.url;


          image.loading =
            "lazy";


          image.addEventListener(
            "click",
            function() {

              openViewer(index);

            }
          );


          item.appendChild(
            image
          );

        }


        /*
          NAME
        */

        if (photo.name) {

          const name =
            document.createElement(
              "div"
            );


          name.className =
            "guest-name";


          name.textContent =
            photo.name;


          item.appendChild(
            name
          );

        }


        /*
          MESSAGE
        */

        if (photo.message) {

          const message =
            document.createElement(
              "div"
            );


          message.className =
            "guest-message";


          message.textContent =
            "“" +
            photo.message +
            "”";


          item.appendChild(
            message
          );

        }


        galleryGrid.appendChild(
          item
        );

      }
    );


  } catch (error) {

    console.error(error);


    galleryGrid.innerHTML =
      '<div class="gallery-empty">Unable to load gallery ♡</div>';

  }

}


/* =========================================
   VIEW GALLERY
========================================= */


viewGallery.addEventListener(
  "click",
  async function() {

    cameraScreen.style.display =
      "none";

    messageBox.style.display =
      "none";

    galleryScreen.style.display =
      "flex";


    await loadGallery();

  }
);


/* =========================================
   BACK TO CAMERA
========================================= */


backCamera.addEventListener(
  "click",
  async function() {

    galleryScreen.style.display =
      "none";

    cameraScreen.style.display =
      "flex";


    await startCamera();

  }
);


/* =========================================
   FULLSCREEN VIEWER
========================================= */


function openViewer(index) {

  if (
    !galleryPhotos[index]
  ) return;


  currentViewerIndex =
    index;


  const item =
    galleryPhotos[index];


  viewerImage.style.display =
    "none";

  viewerVideo.style.display =
    "none";


  if (
    item.type === "video"
  ) {

    viewerVideo.src =
      item.url;

    viewerVideo.style.display =
      "block";


  } else {

    viewerImage.src =
      item.url;

    viewerImage.style.display =
      "block";

  }


  viewer.style.display =
    "flex";

}


function closeViewer() {

  viewerVideo.pause();

  viewerVideo.src =
    "";

  viewer.style.display =
    "none";

}


function showPrevious() {

  if (
    galleryPhotos.length === 0
  ) return;


  currentViewerIndex =
    (
      currentViewerIndex -
      1 +
      galleryPhotos.length
    ) %
    galleryPhotos.length;


  openViewer(
    currentViewerIndex
  );

}


function showNext() {

  if (
    galleryPhotos.length === 0
  ) return;


  currentViewerIndex =
    (
      currentViewerIndex +
      1
    ) %
    galleryPhotos.length;


  openViewer(
    currentViewerIndex
  );

}


viewerClose.addEventListener(
  "click",
  closeViewer
);


viewerPrev.addEventListener(
  "click",
  showPrevious
);


viewerNext.addEventListener(
  "click",
  showNext
);


/* =========================================
   SWIPE
========================================= */


let touchStartX =
  0;


let touchEndX =
  0;


viewer.addEventListener(
  "touchstart",
  function(event) {

    touchStartX =
      event.changedTouches[0].screenX;

  }
);


viewer.addEventListener(
  "touchend",
  function(event) {

    touchEndX =
      event.changedTouches[0].screenX;


    const difference =
      touchEndX -
      touchStartX;


    if (
      Math.abs(difference) < 50
    ) return;


    if (difference > 0) {

      showPrevious();

    } else {

      showNext();

    }

  }
);


/* =========================================
   CLOSE VIEWER
========================================= */


viewer.addEventListener(
  "click",
  function(event) {

    if (
      event.target === viewer
    ) {

      closeViewer();

    }

  }
);

</script>
